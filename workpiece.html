<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workpiece — Virtos Charles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      min-height: 100%;
      background: #FFFFFF;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4rem 1rem 3rem;
      text-align: center;
    }

    .back {
      position: fixed;
      top: 1.5rem; left: 1.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      color: #000;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.25s ease;
    }
    .back:hover, .back:focus-visible { opacity: 1; }

    .page {
      opacity: 0;
      transform: translateY(14px);
      animation: fade-in 0.9s ease forwards 0.15s;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(2.6rem, 8vw, 4rem);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    picture { display: block; }
    .work-link {
      display: block;
      width: calc(var(--s, 1) * min(560px, 84%));
      margin: clamp(2.5rem, 7vw, 4.5rem) auto 0;
      line-height: 0;
      transition: opacity 0.3s ease;
    }
    .work-link:hover, .work-link:focus-visible { opacity: 0.82; }
    .work-link:focus-visible { outline: 2px solid #000; outline-offset: 6px; }
    .work {
      display: block;
      width: 100%;
      height: auto;
    }

    .caption {
      width: calc(var(--s, 1) * min(560px, 84%));
      margin: 0.6rem auto 0;
      text-align: left;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }

    .panorama { width: min(900px, 100%); }
    .panorama-caption { width: min(900px, 100%); }

    @keyframes fade-in {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .page { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <a class="back" href="index.html">← Virtos</a>

  <main class="page">
    <h1>Workpiece</h1>
    <a class="work-link" style="--s:0.724" href="contact.html">
      <picture>
        <source srcset="assets/img/workshop-2.webp" type="image/webp" />
        <img class="work" src="assets/img/workshop-2.jpg" alt="Painting by Virtos Charles: a cartoon figure in a grey top hat and red sweater holding a yellow knife, on a blue background" width="1400" height="1960" loading="lazy" decoding="async" />
      </picture>
    </a>
    <a class="work-link" style="--s:0.995" href="contact.html">
      <picture>
        <source srcset="assets/img/trois-visages-2.webp" type="image/webp" />
        <img class="work" src="assets/img/trois-visages-2.jpg" alt="Painting by Virtos Charles: three cartoon faces with bald heads and bare shoulders, one with a cigar and a red cross pendant, on an orange background" width="1992" height="1463" loading="lazy" decoding="async" />
      </picture>
    </a>
    <a class="work-link" style="--s:0.9" href="contact.html">
      <picture>
        <source srcset="assets/img/be-free-2.webp" type="image/webp" />
        <img class="work" src="assets/img/be-free-2.jpg" alt="Painting by Virtos Charles: a figure in a red sweater and blue trousers carrying a grey sign that reads Be Free, on an orange background" width="1553" height="2174" loading="lazy" decoding="async" />
      </picture>
    </a>
    <a class="work-link" style="--s:0.9" href="contact.html">
      <picture>
        <source srcset="assets/img/clown-diable-2.webp" type="image/webp" />
        <img class="work" src="assets/img/clown-diable-2.jpg" alt="Painting by Virtos Charles: a clown with red devil horns, green hair and a green jacket, holding a pistol, on an orange background" width="1497" height="2000" loading="lazy" decoding="async" />
      </picture>
    </a>
    <p class="caption" style="--s:0.9">“Harcher?”</p>
    <a class="work-link" style="--s:0.9" href="contact.html">
      <picture>
        <source srcset="assets/img/batman-2.webp" type="image/webp" />
        <img class="work" src="assets/img/batman-2.jpg" alt="Painting by Virtos Charles: Batman in a blue cowl with red lips and a bat emblem, on a green background" width="1627" height="2174" loading="lazy" decoding="async" />
      </picture>
    </a>
    <p class="caption" style="--s:0.9">“Naija batbat”</p>
    <a class="work-link" style="--s:0.9" href="contact.html">
      <picture>
        <source srcset="assets/img/deux-hommes.webp" type="image/webp" />
        <img class="work" src="assets/img/deux-hommes.jpg" alt="Painting by Virtos Charles: a bearded man in a grey jacket holding a yellow object with pink drips, and a smiling bald man behind him, on a pale blue background" width="1622" height="2174" loading="lazy" decoding="async" />
      </picture>
    </a>
    <p class="caption" style="--s:0.9">“En Zz”</p>
    <a class="work-link panorama" href="contact.html">
      <picture>
        <source srcset="assets/img/spray-noir-tranche.webp" type="image/webp" />
        <img class="work panorama-img" src="assets/img/spray-noir-tranche.jpg" alt="Painting by Virtos Charles: abstract black spray-paint shapes and drips over a white background" width="2188" height="1629" loading="lazy" decoding="async" />
      </picture>
    </a>
    <p class="caption panorama-caption">“welcome nephew”</p>
  </main>

</body>
</html>
