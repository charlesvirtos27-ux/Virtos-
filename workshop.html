  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      min-height: 100%;
      background: #FFFFFF;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4rem 1rem 3rem;
      text-align: center;
    }

    .back {
      position: fixed;
      top: 1.5rem; left: 1.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      color: #000;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.25s ease;
    }
    .back:hover, .back:focus-visible { opacity: 1; }

    .page {
      opacity: 0;
      transform: translateY(14px);
      animation: fade-in 0.9s ease forwards 0.15s;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(2.6rem, 8vw, 4rem);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    picture { display: block; }
    .work-link {
      display: block;
      width: calc(var(--s, 1) * min(560px, 84%));
      margin: clamp(2.5rem, 7vw, 4.5rem) auto 0;
      line-height: 0;
      transition: opacity 0.3s ease;
    }
    .work-link:hover, .work-link:focus-visible { opacity: 0.82; }
    .work-link:focus-visible { outline: 2px solid #000; outline-offset: 6px; }
    .work {
      display: block;
      width: 100%;
      height: auto;
    }

    @keyframes fade-in {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .page { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
