<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workshop — Virtos Charles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Unbounded:wght@500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      background: #FFFFFF;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 1.5rem 1rem;
      text-align: center;
    }

    .back {
      position: fixed;
      top: 1.5rem; left: 1.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      color: #000;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.25s ease;
    }
    .back:hover, .back:focus-visible { opacity: 1; }

    .soon-block { display: flex; flex-direction: column; align-items: center; }

    .soon {
      font-family: 'Unbounded', 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(1.1rem, 3.6vw, 1.6rem);
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(14px);
      animation: fade-in 0.9s ease forwards 0.15s;
    }

    .soon-line {
      margin-top: 0.25rem;
      animation-delay: 0.35s;
    }

    @keyframes fade-in {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .soon { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <a class="back" href="index.html">← Virtos</a>

  <main>
    <div class="soon-block">
      <p class="soon">First Sale Upcoming Soon</p>
      <p class="soon soon-line">Gb…</p>
    </div>
  </main>

</body>
</html>
