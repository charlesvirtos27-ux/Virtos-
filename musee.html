      var fm = FRAMES[w.frame], ow = wd, oh = ht;
      if (fm) {
        var g = 0.012, fw = wd > 1.2 ? 0.032 : 0.024, fd = 0.068; ow = wd + 2 * (g + fw); oh = ht + 2 * (g + fw);
        frameGroup = new THREE.Group();
        var bar = function (bw, bh, x, y) { var m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, fd), fm); m.position.set(x, y, fd / 2); m.castShadow = true; m.receiveShadow = true; frameGroup.add(m); };
        bar(ow, fw, 0, oh / 2 - fw / 2); bar(ow, fw, 0, -oh / 2 + fw / 2);
        bar(fw, oh - 2 * fw, -ow / 2 + fw / 2, 0); bar(fw, oh - 2 * fw, ow / 2 - fw / 2, 0);
        var back = new THREE.Mesh(new THREE.PlaneGeometry(wd + 2 * g + 0.002, ht + 2 * g + 0.002), gapMat); back.position.z = 0.004; frameGroup.add(back);
        painting.add(frameGroup);
      }
      shadowMesh = new THREE.Mesh(new THREE.PlaneGeometry(ow * 1.45, oh * 1.4), new THREE.MeshBasicMaterial({ map: softShadow, transparent: true, depthWrite: false, opacity: 0.32, color: 0x000000 }));
      shadowMesh.position.set(0.03, -0.05, 0.002); painting.add(shadowMesh);
      painting.userData.h = oh;
    }

    // ===== Caméra : légère parallaxe, on peut regarder un peu autour =====
    var look = { x: 0, y: 0, tx: 0, ty: 0 }, dolly = 0, dollyT = 0;
    function frame() {
      // cadrage d'une vraie scène d'intérieur : la toile et le mobilier au-dessus du cartel, le sol caché dessous
      var small = window.innerWidth < 720;
      var ht0 = painting.userData.h || 0.8, near = 0.64 + 0.36 * Math.min(1, ht0 / 0.8);
      var dist = (small ? 6.4 : 5.4) * near, ty = small ? 0.98 : 1.08;
      var yaw = look.x * 0.28, pitch = look.y * 0.1;
      var cx = Math.sin(yaw) * dist, cz = Math.cos(yaw) * dist + dolly;
      camera.position.set(cx, ty + 0.12 + pitch * 1.2, cz);
      camera.lookAt(0, ty + pitch * 0.4, 0);
    }

    // ===== Transitions =====
    var anim = null;   // glissement de la toile quand on change d'œuvre
    function go(delta) {
      if (anim) return;
      hideHint();
      var next = (cur + delta + WORKS.length) % WORKS.length, dir = delta > 0 ? 1 : -1;
      if (reduce) { cur = next; setPainting(cur); fillCard(); return; }
      anim = { t: 0, phase: 'out', dir: dir, next: next };
    }
    function setWorld(k) {
      if (k === world && U[k] && U[k].visible) return;
      hideHint();
      var swap = function () {
        WORLDS.forEach(function (n) { if (U[n]) U[n].visible = false; });
        world = k; var g = getWorld(k); g.visible = true; scene.background = new THREE.Color(g.userData.bg);
        painting.position.y = hangY[k]; faceMat.color.set(paintTint[k]);
        dolly = reduce ? 0 : 0.6; dollyT = 0; fillCard();
      };
      if (reduce) { swap(); return; }
      $('fade').classList.add('on');
      setTimeout(function () { swap(); requestAnimationFrame(function () { $('fade').classList.remove('on'); }); }, 210);
    }

    // ===== Commandes =====
    $('prev').addEventListener('click', function () { go(-1); });
    $('next').addEventListener('click', function () { go(1); });
    $('series').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-s]'); if (!b || b.dataset.s === sid || anim) return;
      sid = b.dataset.s; WORKS = SERIES[sid].works; cur = 0;
      WORKS.forEach(function (w) { if (!images[w.key]) loadImage('assets/img/' + w.key + '.webp').then(function (im) { images[w.key] = im; if (WORKS[cur] === w) { setPainting(cur); } }); });
      setPainting(cur); fillCard(); hideHint();
    });
    $('worlds').addEventListener('click', function (e) { var b = e.target.closest('button[data-w]'); if (b) setWorld(b.dataset.w); });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
      else if (/^[1-4]$/.test(e.key)) setWorld(WORLDS[Number(e.key) - 1]);
    });
    var hintTimer = null; function hideHint() { $('hint').classList.add('gone'); }
    setTimeout(hideHint, 7000);
    var drag = null;
    canvas.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: performance.now(), lx: look.tx, ly: look.ty }; });
    window.addEventListener('pointermove', function (e) {
      if (drag) {
        var dx = (e.clientX - drag.x0) / window.innerWidth, dy = (e.clientY - drag.y0) / window.innerHeight;
        if (e.pointerType === 'mouse') { look.tx = Math.max(-1, Math.min(1, drag.lx - dx * 2.4)); look.ty = Math.max(-1, Math.min(1, drag.ly + dy * 2)); canvas.classList.add('drag'); }
        else { look.tx = Math.max(-1, Math.min(1, drag.lx - dx * 1.6)); }
      } else if (e.pointerType === 'mouse' && !touch) {
        // au repos, la vue suit doucement la souris : une parallaxe à peine perceptible
        look.tx = ((e.clientX / window.innerWidth) - 0.5) * -0.35; look.ty = ((e.clientY / window.innerHeight) - 0.5) * 0.3;
      }
    });
    window.addEventListener('pointerup', function (e) {
      if (!drag) return;
      var dx = e.clientX - drag.x0, dt = performance.now() - drag.t; canvas.classList.remove('drag');
      // sur téléphone, un balayage franc change d'œuvre
      if (e.pointerType !== 'mouse' && Math.abs(dx) > 60 && dt < 600) { look.tx = drag.lx; go(dx < 0 ? 1 : -1); }
      drag = null;
    });

    window.addEventListener('hashchange', function () {
      var h = location.hash.slice(1).split('/'), ok = false;
      Object.keys(SERIES).forEach(function (k) { var i = SERIES[k].works.map(function (w) { return w.key; }).indexOf(h[0]); if (i >= 0 && (k !== sid || i !== cur)) { sid = k; WORKS = SERIES[k].works; cur = i; setPainting(cur); ok = true; } });
      if (WORLDS.indexOf(h[1]) >= 0 && h[1] !== world) setWorld(h[1]); else if (ok) fillCard();
    });
    function size() { var w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < 720 ? 54 : 38; camera.updateProjectionMatrix(); }
    window.addEventListener('resize', size);

    // ===== Chargement =====
    function loadImage(src) { return new Promise(function (ok) { var im = new Image(); im.decoding = 'async'; im.onload = function () { ok(im); }; im.onerror = function () { ok(null); }; im.src = src; }); }
    var done = 0;
    // la toile demandée d'abord, les autres ensuite
    var order = WORKS.map(function (w, i) { return i; }); order.sort(function (a, b) { return (a === cur ? -1 : 0) - (b === cur ? -1 : 0); });
    var first = loadImage('assets/img/' + WORKS[cur].key + '.webp').then(function (im) { images[WORKS[cur].key] = im; });
    Promise.all([first, document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(function (ok) { setTimeout(ok, 1500); })]) : null]).then(function () {
      $('loadFill').style.width = '60%';
      setPainting(cur);
      var w0 = world; world = ''; U = {};
      var g = getWorld(w0); g.visible = true; world = w0; scene.background = new THREE.Color(g.userData.bg);
      painting.position.y = hangY[world]; faceMat.color.set(paintTint[world]);
      fillCard(); size(); frame();
      $('loadFill').style.width = '100%';
      setTimeout(function () { $('veil').classList.add('done'); }, 150);
      dolly = reduce ? 0 : 0.9;
      requestAnimationFrame(loop);
      // le reste se charge en arrière-plan (images, puis les autres univers)
      Object.keys(SERIES).forEach(function (k) { SERIES[k].works.forEach(function (w) { if (!images[w.key]) loadImage('assets/img/' + w.key + '.webp').then(function (im) { images[w.key] = im; if (WORKS[cur] === w) setPainting(cur); }); }); });
      setTimeout(function () { WORLDS.forEach(function (k) { getWorld(k); }); }, 1200);
    });

    var last = performance.now();
    var easeOut = function (t) { return 1 - Math.pow(1 - t, 3); }, easeIn = function (t) { return t * t; };
    function loop(now) {
      requestAnimationFrame(loop);
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (document.hidden) return;
      var k = 1 - Math.pow(0.002, dt);
      look.x += (look.tx - look.x) * k; look.y += (look.ty - look.y) * k;
      dolly += (dollyT - dolly) * (1 - Math.pow(0.02, dt));
      if (anim) {
        anim.t += dt / (anim.phase === 'out' ? 0.22 : 0.42);
        var t = Math.min(1, anim.t);
        if (anim.phase === 'out') {
          painting.position.x = -anim.dir * 0.5 * easeIn(t); faceMat.opacity = sideMat.opacity = 1 - t;
          if (t >= 1) { cur = anim.next; setPainting(cur); fillCard(); anim.phase = 'in'; anim.t = 0; }
        } else {
          painting.position.x = anim.dir * 0.5 * (1 - easeOut(t)); faceMat.opacity = sideMat.opacity = t;
          if (t >= 1) { painting.position.x = 0; faceMat.opacity = sideMat.opacity = 1; anim = null; }
        }
        if (shadowMesh) shadowMesh.material.opacity = 0.32 * faceMat.opacity;
      }
      frame();
      renderer.render(scene, camera);
    }
  })();
  </script>
</body>
