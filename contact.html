<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Virtos Charles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #FFFFFF;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      text-align: center;
    }

    .back {
      position: fixed;
      top: 1.5rem; left: 1.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      color: #000;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.25s ease;
    }
    .back:hover, .back:focus-visible { opacity: 1; }

    .page {
      opacity: 0;
      transform: translateY(14px);
      animation: fade-in 0.9s ease forwards 0.15s;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(2.6rem, 8vw, 4rem);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .mail { margin-top: 1.4rem; }
    .mail a {
      position: relative;
      display: inline-block;
      padding: 0.3rem 0;
      font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
      font-size: clamp(1.1rem, 3.6vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #000;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .mail a::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0.1rem;
      height: 2px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.35s ease;
    }
    .mail a:hover::after, .mail a:focus-visible::after { transform: scaleX(1); transform-origin: left; }
    .mail a:focus-visible { outline: none; }

    @keyframes fade-in {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .page { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <a class="back" href="index.html">← Virtos</a>

  <main class="page">
    <h1>Contact</h1>
    <p class="mail"><a href="mailto:VirtosCharle@outlook.com">VirtosCharle@outlook.com</a></p>
  </main>

</body>
</html>
