<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — Virtos Charles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Cormorant+Garamond:ital,wght@1,500&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      min-height: 100%;
      background: #FFFFFF;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4rem 1rem 3rem;
      text-align: center;
    }

    .back {
      position: fixed;
      z-index: 10;
      top: 1rem; left: 1rem;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      color: #000;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.25s ease;
    }
    .back:hover, .back:focus-visible { opacity: 1; }

    .page {
      opacity: 0;
      transform: translateY(14px);
      animation: fade-in 0.9s ease forwards 0.15s;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(2.6rem, 8vw, 4rem);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    picture { display: block; }
    .about-art {
      display: block;
      width: min(420px, 84%);
      height: auto;
      margin: clamp(2.5rem, 7vw, 4.5rem) auto 0;
    }

    .work-link {
      display: block;
      width: calc(var(--s, 1) * min(560px, 84%));
      margin: clamp(2.5rem, 7vw, 4.5rem) auto 0;
      line-height: 0;
      transition: opacity 0.3s ease;
    }
    .work-link:hover, .work-link:focus-visible { opacity: 0.82; }
    .work-link:focus-visible { outline: 2px solid #000; outline-offset: 6px; }
    .work { display: block; width: 100%; height: auto; }

    .about-year {
      width: min(420px, 84%);
      margin: clamp(0.8rem, 2.5vw, 1.2rem) auto 0;
      text-align: left;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }

    .about-title {
      margin: clamp(3rem, 9vw, 5rem) auto 0;
      font-family: 'Pinyon Script', cursive;
      font-style: normal;
      font-size: clamp(2.6rem, 8vw, 3.6rem);
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #E8A0B4;
    }
    .about-line {
      margin: 0.4rem auto 0;
      max-width: 40ch;
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(1.15rem, 3vw, 1.45rem);
      line-height: 1.4;
    }

    @keyframes fade-in {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .page { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <a class="back" href="index.html">← Home</a>

  <main class="page">
    <h1>About</h1>
    <h2 class="about-title">.A love story</h2>
    <p class="about-line">“die trying to express something to someone”</p>
    <a class="work-link" style="--s:0.9" href="contact.html">
      <picture>
        <source srcset="assets/img/dolo1.webp" type="image/webp" />
        <img class="work" src="assets/img/dolo1.jpg" alt="Painting by Virtos Charles: a dark-faced figure with a red mouth and a pink jacket, against a pale blue and pink background" width="1660" height="2188" loading="lazy" decoding="async" />
      </picture>
    </a>
    <p class="caption" style="--s:0.9">“Dolo1”</p>
    <picture>
      <source srcset="assets/img/workshop-3.webp" type="image/webp" />
      <img class="about-art" src="assets/img/workshop-3.jpg" alt="Painting by Virtos Charles: black spray-painted lettering reading NEED MONEY FOR PORSCHE, crossed out, and YOU. on a red background" width="1500" height="2000" decoding="async" />
    </picture>
    <p class="about-year">2022</p>
    <a class="work-link" style="--s:0.9" href="contact.html">
      <picture>
        <source srcset="assets/img/madone-bleue-2.webp" type="image/webp" />
        <img class="work" src="assets/img/madone-bleue-2.jpg" alt="Painting by Virtos Charles: a woman in a blue hooded veil with rosary beads and red lips, on a pink background" width="1498" height="1996" decoding="async" />
      </picture>
    </a>
    <a class="work-link" style="--s:0.9" href="contact.html">
      <picture>
        <source srcset="assets/img/chapeau-rose.webp" type="image/webp" />
        <img class="work" src="assets/img/chapeau-rose.jpg" alt="Painting by Virtos Charles: a figure in a large pink hat and a purple jacket with a rosary and cross pendant, on a deep red background" width="1488" height="2002" loading="lazy" decoding="async" />
      </picture>
    </a>
    <a class="work-link" style="--s:0.9" href="contact.html">
      <picture>
        <source srcset="assets/img/femme-chapeau-2.webp" type="image/webp" />
        <img class="work" src="assets/img/femme-chapeau-2.jpg" alt="Painting by Virtos Charles: a woman with curly brown hair in a cream hat and a fur stole, with red lips, on a pink background" width="1481" height="2000" loading="lazy" decoding="async" />
      </picture>
    </a>
    <a class="work-link" style="--s:0.9" href="contact.html">
      <picture>
        <source srcset="assets/img/homme-yeux-rouges-2.webp" type="image/webp" />
        <img class="work" src="assets/img/homme-yeux-rouges-2.jpg" alt="Painting by Virtos Charles: a bald cartoon figure with large red eyes, a cross earring and a white zip-neck top, on a pink background" width="1498" height="2000" loading="lazy" decoding="async" />
      </picture>
    </a>
    <a class="work-link" style="--s:1.0" href="contact.html">
      <picture>
        <source srcset="assets/img/workshop-1.webp" type="image/webp" />
        <img class="work" src="assets/img/workshop-1.jpg" alt="Painting by Virtos Charles: a bald cartoon figure in a blue jacket holding a pistol, on a pink background" width="1590" height="1166" loading="lazy" decoding="async" />
      </picture>
    </a>
    <a class="work-link" style="--s:0.9" href="contact.html">
      <picture>
        <source srcset="assets/img/clown-triste-2.webp" type="image/webp" />
        <img class="work" src="assets/img/clown-triste-2.jpg" alt="Painting by Virtos Charles: a sad clown with purple hair, a grey top hat, blue tears and a large bow tie, on a pink background" width="1557" height="2186" loading="lazy" decoding="async" />
      </picture>
    </a>
  </main>

  <script>
    (function () {
      var back = document.querySelector('.back');
      if (!back) return;
      back.addEventListener('click', function (e) {
        try {
          if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
            e.preventDefault();
            history.back();
          }
        } catch (err) {}
      });
    })();
  </script>

</body>
</html>
