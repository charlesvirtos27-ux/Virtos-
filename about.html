<!DOCTYPE html>
<html lang="en-GB">
<head>
  <script>(function(){var ok=false;try{ok=!!localStorage.getItem('access');}catch(e){}if(!ok&&/(^|; )virtos_access=1/.test(document.cookie))ok=true;if(!ok){var p=location.pathname.split('/').pop()||'index.html';location.replace('acces.html?next='+encodeURIComponent(p+location.search+location.hash));}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — Virtos Charles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Cormorant+Garamond:ital,wght@1,500&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      min-height: 100%;
      background: #FFFFFF;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4rem 1rem 3rem;
      text-align: center;
    }

    .back {
      position: fixed;
      z-index: 10;
      top: 1rem; left: 1rem;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      color: #000;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.25s ease;
    }
    .back:hover, .back:focus-visible { opacity: 1; }

    .page {
      opacity: 0;
      transform: translateY(14px);
      animation: fade-in 0.9s ease forwards 0.15s;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(2.6rem, 8vw, 4rem);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    picture { display: block; }
    .about-art {
      display: block;
      width: min(420px, 84%);
      height: auto;
      margin: clamp(2.5rem, 7vw, 4.5rem) auto 0;
    }

    .work-link {
      display: block;
      width: calc(var(--s, 1) * min(560px, 84%));
      margin: clamp(2.5rem, 7vw, 4.5rem) auto 0;
      line-height: 0;
      transition: opacity 0.3s ease;
    }
    .work-link:hover, .work-link:focus-visible { opacity: 0.82; }
    .work-link:focus-visible { outline: 2px solid #000; outline-offset: 6px; }
    .work { display: block; width: 100%; height: auto; }

    .about-year {
      width: min(420px, 84%);
      margin: clamp(0.8rem, 2.5vw, 1.2rem) auto 0;
      text-align: left;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }

    .about-title {
      margin: clamp(3rem, 9vw, 5rem) auto 0;
      font-family: 'Pinyon Script', cursive;
      font-style: normal;
      font-size: clamp(2.6rem, 8vw, 3.6rem);
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #E8A0B4;
    }
    .about-line {
      margin: 0.4rem auto 0;
      max-width: 40ch;
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(1.15rem, 3vw, 1.45rem);
      line-height: 1.4;
    }

    @keyframes fade-in {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .page { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <a class="back" href="index.html" data-i18n="nav.back">← Back</a>

  <main class="page">
    <h1 data-i18n="nav.about">About</h1>
    <h2 class="about-title" data-i18n="about.title">.A love story</h2>
    <p class="about-line" data-i18n="about.line">“die trying to express something to someone”</p>
  </main>

  <script src="assets/i18n.js"></script>
  <script>
    I18N.add({ en: {"doc.title": "About — Virtos Charles", "about.title": ".A love story", "about.line": "“die trying to express something to someone”"}, fr: {"doc.title": "À propos — Virtos Charles", "about.title": ".Une histoire d’amour", "about.line": "“mourir en essayant d’exprimer quelque chose à quelqu’un”"} });
    I18N.init();
  </script>
  <script>
    (function () {
      var back = document.querySelector('.back');
      if (!back) return;
      back.addEventListener('click', function (e) {
        try {
          if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
            e.preventDefault();
            history.back();
          }
        } catch (err) {}
      });
    })();
  </script>

</body>
</html>
