<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — Virtos Charles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      min-height: 100%;
      background: #FFFFFF;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4rem 1rem 3rem;
      text-align: center;
    }

    .back {
      position: fixed;
      top: 1.5rem; left: 1.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      color: #000;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.25s ease;
    }
    .back:hover, .back:focus-visible { opacity: 1; }

    .page {
      opacity: 0;
      transform: translateY(14px);
      animation: fade-in 0.9s ease forwards 0.15s;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(2.6rem, 8vw, 4rem);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    picture { display: block; }
    .about-art {
      display: block;
      width: min(420px, 84%);
      height: auto;
      margin: clamp(2.5rem, 7vw, 4.5rem) auto 0;
    }

    .about-year {
      margin: clamp(1rem, 3vw, 1.5rem) auto 0;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }

    .about-line {
      margin: clamp(1.4rem, 4vw, 2rem) auto 0;
      max-width: 40ch;
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(1.15rem, 3vw, 1.45rem);
      line-height: 1.4;
    }

    @keyframes fade-in {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .page { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <a class="back" href="index.html">← Virtos</a>

  <main class="page">
    <h1>About</h1>
    <p class="about-line">die trying to express something to someone</p>
    <picture>
      <source srcset="assets/img/workshop-3.webp" type="image/webp" />
      <img class="about-art" src="assets/img/workshop-3.jpg" alt="Painting by Virtos Charles: black spray-painted lettering reading NEED MONEY FOR PORSCHE, crossed out, and YOU. on a red background" width="1500" height="2000" decoding="async" />
    </picture>
    <p class="about-year">2022</p>
  </main>

</body>
</html>
