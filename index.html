<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtos Charles — Artist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent:      #A6DDFF;
      --accent-deep: #5FB3E8;
      --ink:         #16191D;
      --muted:       #6B7280;
      --bg:          #FFFFFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: linear-gradient(180deg, #F3FAFF 0%, #FFFFFF 75%);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(14px);
      animation: fade-in 0.9s ease forwards 0.15s;
    }

    .splash-tag {
      display: flex; align-items: center; gap: 0.6rem;
      font-size: 0.8rem; letter-spacing: 0.04em;
      color: var(--accent-deep); font-weight: 500;
      margin-bottom: 1.6rem;
    }
    .splash-tag .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent-deep);
    }

    .splash-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .splash-tagline {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 32ch;
      margin-bottom: 2.6rem;
    }
    .splash-tagline em {
      color: var(--accent-deep);
      font-style: italic;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.95rem 2.4rem;
      background: var(--accent);
      color: var(--ink);
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      border-radius: 50px;
      transition: background 0.25s, transform 0.25s;
    }
    .enter-btn:hover {
      background: var(--accent-deep);
      transform: translateY(-1px);
    }
    .enter-btn .arrow {
      transition: transform 0.25s;
    }
    .enter-btn:hover .arrow {
      transform: translateX(3px);
    }

    @keyframes fade-in {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <div class="splash">
    <p class="splash-tag"><span class="dot"></span>Artist</p>
    <h1 class="splash-name">Virtos Charles</h1>
    <p class="splash-tagline">Art as a <em>living language</em>.</p>
    <a href="main.html" class="enter-btn">Enter <span class="arrow">→</span></a>
  </div>

</body>
</html>
