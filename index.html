<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtos Charles — Artist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent:      #A6DDFF;
      --accent-deep: #5FB3E8;
      --ink:         #16191D;
      --muted:       #6B7280;
      --bg:          #FFFFFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: linear-gradient(180deg, #F3FAFF 0%, #FFFFFF 75%);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .home {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(14px);
      animation: fade-in 0.9s ease forwards 0.15s;
    }

    .home-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3.2rem, 11vw, 6rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 3.2rem;
    }

    .home-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .home-menu a {
      display: inline-flex;
      align-items: baseline;
      gap: 0.6rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      padding: 0.5rem 0;
      transition: color 0.25s;
    }
    .home-menu a .arrow {
      font-size: 0.9em;
      color: var(--accent-deep);
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.25s, transform 0.25s;
    }
    .home-menu a:hover,
    .home-menu a:focus-visible {
      color: var(--accent-deep);
    }
    .home-menu a:hover .arrow,
    .home-menu a:focus-visible .arrow {
      opacity: 1;
      transform: none;
    }

    @keyframes fade-in {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .home { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <div class="home">
    <h1 class="home-logo">Virtos</h1>
    <ul class="home-menu">
      <li><a href="main.html#shop">Store <span class="arrow">→</span></a></li>
      <li><a href="main.html#works">Artwork <span class="arrow">→</span></a></li>
      <li><a href="main.html#about">Me <span class="arrow">→</span></a></li>
    </ul>
  </div>

</body>
</html>
